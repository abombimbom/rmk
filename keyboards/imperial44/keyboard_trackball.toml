[keyboard]
name = "Ergohaven Imperial44 Trackball"
product_name = "I44 Trackball"
vendor_id = 0xE126
product_id = 0x0440
manufacturer = "Ergohaven"
chip = "nrf52840"

[host]
vial_enabled = true
unlock_keys = [[1, 2], [1, 1]]

[event]
action.channel_size = 16
action.subs = 2
keyboard.subs = 4
peripheral_battery.pubs = 2
peripheral_battery.subs = 4
layer_change.channel_size = 4
layer_change.subs = 6
modifier.channel_size = 8
modifier.subs = 6
peripheral_settings_refresh.subs = 1
sleep_state.subs = 4

[layout]
rows = 9
cols = 6
layers = 16
no_action_layer_start = 5
# Split halves keep the Imperial44 grid (left: rows 0-3, right: rows 4-7).
# Row 8 carries the six trackball dongle buttons in ZMK input-gpios order:
# P1_11, P1_10, P0_03, P0_28, P0_00, P0_01.
matrix_map = """
(0,5,L) (0,4,L) (0,3,L) (0,2,L) (0,1,L) (0,0,L)                    (4,0,R) (4,1,R) (4,2,R) (4,3,R) (4,4,R) (4,5,R)
(1,5,L) (1,4,L) (1,3,L) (1,2,L) (1,1,L) (1,0,L)                    (5,0,R) (5,1,R) (5,2,R) (5,3,R) (5,4,R) (5,5,R)
(2,5,L) (2,4,L) (2,3,L) (2,2,L) (2,1,L) (2,0,L) (3,0,*)    (7,0,*) (6,0,R) (6,1,R) (6,2,R) (6,3,R) (6,4,R) (6,5,R)
                        (3,3,*) (3,2,*) (3,1,*)    (7,1,*) (7,2,*) (7,3,*)
(8,0,*) (8,1,*) (8,2,*) (8,3,*) (8,4,*) (8,5,*)
"""

[[layer]]
name = "Base"
# Minimal factory layers. The real ZMK layout (hold-tap, RU, combos, morse)
# is ported separately. Trackball button row 8 in ZMK input-gpios pin order
# (P1_11, P1_10, P0_03, P0_28, P0_00, P0_01): MB3 (middle click, hold gives
# native autoscroll), scroll hold, MB2, MB1, BT next profile, BT profile 0.
# Sniper mode: hold the scroll button plus the MB3 button on the Scroll layer.
keys = """
Escape  Q     W     E     R     T     Y     U     I     O     P     Backspace
Tab     A     S     D     F     G     H     J     K     L     Semicolon  RGui
LShift  Z     X     C     V     B     LeftBracket RightBracket N M Comma Dot Quote RShift
                          LCtrl MO(1) Space Enter MO(2) LAlt
MouseBtn3 MO(3) MouseBtn2 MouseBtn1 User5 User0
"""
encoders = [["AudioVolUp","AudioVolDown"],["AudioVolUp","AudioVolDown"]]

[[layer]]
name = "Ru"
# Placeholder until the ZMK RU layer is ported.
keys = """
Escape  Q     W     E     R     T     Y     U     I     O     P     Backspace
Tab     A     S     D     F     G     H     J     K     L     Semicolon  RGui
LShift  Z     X     C     V     B     LeftBracket RightBracket N M Comma Dot Quote RShift
                          LCtrl MO(1) Space Enter MO(2) LAlt
MouseBtn3 MO(3) MouseBtn2 MouseBtn1 User5 User0
"""
encoders = [["AudioVolUp","AudioVolDown"],["AudioVolUp","AudioVolDown"]]

[[layer]]
name = "Symbols"
keys = """
_  SHIFTED(Kc2)  SHIFTED(Comma)  Equal  SHIFTED(Dot)       Grave           SHIFTED(Kc6)  SHIFTED(Quote)       SHIFTED(Minus)      Quote           _              _
_  Backslash     SHIFTED(Kc9)    Minus  SHIFTED(Kc0)       SHIFTED(Equal)  SHIFTED(Kc5)  SHIFTED(LeftBracket) Semicolon           SHIFTED(RightBracket) SHIFTED(Kc1) _
_  SHIFTED(Kc3)  SHIFTED(Kc8)    SHIFTED(Semicolon) Slash  _               _             _                    _                   SHIFTED(Backslash) SHIFTED(Grave) SHIFTED(Kc7) SHIFTED(Kc4) _
                             _  MO(3)  DF(0) DF(1) _  _
MouseBtn3 MO(3) MouseBtn2 MouseBtn1 User5 User0
"""
encoders = [["AudioVolUp","AudioVolDown"],["AudioVolUp","AudioVolDown"]]

[[layer]]
name = "Scroll"
# Motion maps to wheel with inverted Y. The first row-8 button holds the
# sniper layer here, so scroll hold + that button reaches sniper mode.
keys = """
_  _  _  _  _  _                    _  _  _  _  _  _
_  _  _  _  _  _                    _  _  _  _  _  _
_  _  _  _  _  _  _  _  _  _  _  _  _  _
            _  _  _  _  _  _
MO(4) MO(3) MouseBtn2 MouseBtn1 User5 User0
"""
encoders = [["MouseWheelDown","MouseWheelUp"],["MouseWheelDown","MouseWheelUp"]]

[[layer]]
name = "Sniper"
keys = """
_  _  _  _  _  _                    _  _  _  _  _  _
_  _  _  _  _  _                    _  _  _  _  _  _
_  _  _  _  _  _  _  _  _  _  _  _  _  _
            _  _  _  _  _  _
MO(4) MO(3) MouseBtn2 MouseBtn1 User5 User0
"""
encoders = [["MouseWheelDown","MouseWheelUp"],["MouseWheelDown","MouseWheelUp"]]

[ble]
enabled = true
default_tx_power = 8
use_2m_phy = false

[split]
connection = "ble"

# Dongle: no key matrix, six direct-pin trackball buttons mapped to layout row 8.
[split.central]
rows = 1
cols = 6
row_offset = 8
col_offset = 0

[split.central.matrix]
matrix_type = "direct_pin"
direct_pin_low_active = true
direct_pins = [["P1_11", "P1_10", "P0_03", "P0_28", "P0_00", "P0_01"]]

# PMW3610 over bitbang SPI, pins transcribed from ergohaven-zmk
# (boards/arm/ergohaven/ergohaven-pinctrl.dtsi spi0_default and
# boards/shields/trackball/trackball.dtsi).
# Axis flags match the Ergohaven Royal build (CONFIG_PMW3610_SWAP_XY,
# INVERT_X, INVERT_Y): the sensor sits rotated 90° on the PCB, so X and Y
# are exchanged in hardware and both axes are inverted.
[[split.central.input_device.pmw3610]]
name = "trackball0"
spi.instance = "bitbang0"
spi.sck = "P0_08"
spi.mosi = "P0_17"
spi.miso = "P0_17"
spi.cs = "P0_13"
motion = "P0_15"
cpi = 1000
swap_xy = true
invert_x = true
invert_y = true
force_awake = true
report_hz = 125

[[split.peripheral]]
rows = 4
cols = 6
row_offset = 0
col_offset = 0

[split.peripheral.matrix]
# ZMK left col order: P1_11, P1_10, P0_03, P0_28, P1_13, P0_02
row_pins = ["P0_29", "P0_10", "P0_09", "P0_24"]
col_pins = ["P1_11", "P1_10", "P0_03", "P0_28", "P1_13", "P0_02"]

[[split.peripheral.input_device.encoder]]
pin_a = "P1_02"
pin_b = "P1_00"
phase = "resolution"
resolution = 2
internal_pullup = true

[[split.peripheral]]
rows = 4
cols = 6
row_offset = 4
col_offset = 0

[split.peripheral.matrix]
# ZMK right col order: P1_13, P0_02, P0_29, P0_10, P0_09, P0_24
row_pins = ["P0_13", "P0_28", "P0_03", "P1_10"]
col_pins = ["P1_13", "P0_02", "P0_29", "P0_10", "P0_09", "P0_24"]

[[split.peripheral.input_device.encoder]]
pin_a = "P1_02"
pin_b = "P1_00"
phase = "resolution"
resolution = 2
internal_pullup = true

# Language layers: DF(layer) makes the layer default, deactivates all other
# layers and sends the bound macro. The macros are the OS input-layout hotkeys:
# Ctrl+Shift+1 selects the first layout (EN), Ctrl+Shift+2 the second (RU).
[[behavior.macro.macros]]
operations = [
  { operation = "down", keycode = "LCtrl" },
  { operation = "down", keycode = "LShift" },
  { operation = "tap", keycode = "Kc1" },
  { operation = "up", keycode = "LShift" },
  { operation = "up", keycode = "LCtrl" },
]

[[behavior.macro.macros]]
operations = [
  { operation = "down", keycode = "LCtrl" },
  { operation = "down", keycode = "LShift" },
  { operation = "tap", keycode = "Kc2" },
  { operation = "up", keycode = "LShift" },
  { operation = "up", keycode = "LCtrl" },
]

[behavior.language_layer]
en = { layer = 0, macro = 0 }
ru = { layer = 1, macro = 1 }

[rmk]
split_peripherals_num = 2
split_pairing_timeout_seconds = 30
ble_reconnect_timeout_seconds = 300
ble_pairing_timeout_seconds = 60
split_central_sleep_timeout_seconds = 900
combo_max_num = 32
combo_max_length = 4
fork_max_num = 32
morse_max_num = 32
max_patterns_per_key = 8
macro_space_size = 2048
ble_profiles_num = 5
protocol_max_bulk_size = 8
protocol_macro_chunk_size = 64

[storage]
start_addr = 0xCC000
num_sectors = 32
clear_storage = false

# Prevent cargo from looking for a workspace above this directory
[workspace]
members = ["."]
